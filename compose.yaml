# Entorno local de PulsePass: solo PostgreSQL.
# Las variables viven en backend/.env (no se sube; la plantilla es backend/.env.example).
# Levantar:  docker compose --env-file backend/.env up -d
name: pulsepass

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB en backend/.env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER en backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en backend/.env}
    ports:
      - "5432:5432"
    volumes:
      - pulsepass_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pulsepass_pgdata:
